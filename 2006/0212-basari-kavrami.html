<style id="article-print-style">

/* ============================================================
   PRINT BUTTON
   ============================================================ */

.print-button-container {
    display: flex;
    justify-content: flex-end;
    margin: 0 0 20px 0;
}

.print-button {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 9px 15px;

    border: 1px solid #b9a36a;
    border-radius: 6px;

    background: transparent;
    color: #333;

    font-family: Georgia, "Times New Roman", serif;
    font-size: 15px;

    cursor: pointer;

    transition:
        background-color 0.2s ease,
        color 0.2s ease,
        border-color 0.2s ease;
}

.print-button:hover {
    background: #b9a36a;
    color: white;
    border-color: #b9a36a;
}

.print-icon {
    font-size: 16px;
    line-height: 1;
}


/* ============================================================
   PRINT VERSION
   ============================================================ */

@media print {

    /* Remove everything that should not appear on paper */

    .print-button-container,
    nav,
    footer,
    .top-nav,
    .article-navigation,
    .article-nav,
    .site-header {
        display: none !important;
    }


    /* White page background */

    html,
    body {
        background: white !important;
        color: black !important;
    }


    /* Remove decorative shadows and borders */

    * {
        box-shadow: none !important;
        text-shadow: none !important;
    }


    /* Main article area */

    main {
        width: 100% !important;
        max-width: none !important;

        margin: 0 !important;
        padding: 0 !important;
    }


    .container {
        width: 100% !important;
        max-width: none !important;

        margin: 0 !important;
        padding: 0 !important;
    }


    /* Article card */

    .article-card {
        width: 100% !important;
        max-width: none !important;

        margin: 0 !important;
        padding: 0 !important;

        border: none !important;
        background: white !important;
    }


    /* Article title */

    h1,
    h2 {
        color: black !important;
    }


    /* Article text */

    p {
        color: black !important;
    }


    /* Links should print as normal text */

    a {
        color: black !important;
        text-decoration: none !important;
    }


    /* Prevent awkward page breaks */

    h1,
    h2,
    h3 {
        break-after: avoid;
    }

    p {
        orphans: 3;
        widows: 3;
    }
}

</style>

</head>
